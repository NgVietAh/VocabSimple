name: Generate Git Professional Report

on:
  push:
    branches: [main, master]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Report
        run: |
          # 1. ĐỊNH NGHĨA ĐƯỜNG DẪN
          PROJECT_DIR="vocabsimple"
          SEARCH_PATH="$PROJECT_DIR/lib"

          # 2. THÔNG TIN CƠ BẢN
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          # 3. THỐNG KÊ CONTRIBUTORS
          CONTRIBUTORS_ROWS=""
          AUTHORS=$(git log --format='%ae' | sort -u)
          for EMAIL in $AUTHORS; do
            NAME=$(git log --author="$EMAIL" --format='%an' -1)
            C_COUNT=$(git rev-list --count --author="$EMAIL" HEAD)
            STATS=$(git log --author="$EMAIL" --numstat --pretty=tformat: | awk 'NF{ add += $1; subs += $2 } END { printf "%d %d", add, subs }')
            LOC_ADD=$(echo $STATS | awk '{print $1}'); [ -z "$LOC_ADD" ] && LOC_ADD=0
            LOC_SUB=$(echo $STATS | awk '{print $2}'); [ -z "$LOC_SUB" ] && LOC_SUB=0
            F_COUNT=$(git log --author="$EMAIL" --name-only --pretty=format: | sort -u | sed '/^\s*$/d' | wc -l)
            CONTRIBUTORS_ROWS+="<tr><td><b>$NAME</b></td><td>$C_COUNT</td><td><span style='color:green'>+$LOC_ADD</span></td><td><span style='color:red'>-$LOC_SUB</span></td><td>$F_COUNT</td></tr>"
          done

          # 4. TIMELINE THEO TUẦN
          WEEKLY_LABELS=""
          WEEKLY_DATA=""
          for i in {7..0..-1}; do
            DATE_VAL=$(date -d "$i weeks ago" +%Y-%m-%d)
            W_COUNT=$(git rev-list --count --since="$DATE_VAL 00:00:00" HEAD)
            WEEKLY_LABELS+="\"W-$i\", "
            WEEKLY_DATA+="$W_COUNT, "
          done
          WEEKLY_LABELS=$(echo $WEEKLY_LABELS | sed 's/, $//')
          WEEKLY_DATA=$(echo $WEEKLY_DATA | sed 's/, $//')

          # 5. CODE OWNERSHIP CHI TIẾT ĐẾN TỪNG FILE
          OWNERSHIP_ROWS=""
          if [ -d "$SEARCH_PATH" ]; then
            # Tìm tất cả file .dart
            ALL_FILES=$(find "$SEARCH_PATH" -maxdepth 10 -name "*.dart" -type f)
            
            while read -r file; do
              FILE_LINES=$(wc -l < "$file")
              if [ "$FILE_LINES" -gt 0 ]; then
                # Lấy Owner thực tế dựa trên số dòng đóng góp trong file
                OWNER=$(git blame --line-porcelain "$file" | grep "^author " | sort | uniq -c | sort -rn | head -1 | sed 's/^.*author //')
                OWNER_LINES=$(git blame --line-porcelain "$file" | grep "^author $OWNER" | wc -l)
                PERCENT=$(awk "BEGIN {printf \"%.1f\", ($OWNER_LINES/$FILE_LINES)*100}")
                
                # Rút gọn tên file để hiển thị
                DISPLAY_NAME=$(echo "$file" | sed "s|$PROJECT_DIR/||")
                
                OWNERSHIP_ROWS+="<tr class='ownership-row'><td><span class='folder-badge'>$DISPLAY_NAME</span></td><td>$OWNER</td><td><div class='progress-container'><div class='progress-bar' style='width: $PERCENT%'></div></div><span class='percent-text'>$PERCENT%</span></td></tr>"
              fi
            done <<< "$ALL_FILES"
          fi

          # 6. TẠO HTML
          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <style>
              body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f9; color: #333; padding: 20px; }
              .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
              h1 { color: #1a73e8; text-align: center; margin-bottom: 30px; }
              .info-grid { display: grid; grid-template-columns: 1fr 1fr; background: #e7f3ff; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
              table { width: 100%; border-collapse: collapse; margin-top: 15px; }
              th { background: #f8f9fa; padding: 12px; border-bottom: 2px solid #dee2e6; text-align: left; font-size: 0.9em; }
              td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 0.85em; }
              .folder-badge { background: #f0f2f5; padding: 3px 8px; border-radius: 4px; font-family: 'Consolas', monospace; color: #1a73e8; }
              .progress-container { background: #eee; width: 80px; height: 8px; display: inline-block; border-radius: 4px; overflow: hidden; vertical-align: middle; margin-right: 8px; }
              .progress-bar { background: #34a853; height: 100%; }
              .percent-text { font-weight: bold; color: #34a853; }
              .hidden { display: none !important; }
              .btn-show-more { display: block; width: 250px; margin: 25px auto; padding: 12px; background: #1a73e8; color: white; text-align: center; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
              .btn-show-more:hover { background: #1557b0; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
            </style>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          </head>
          <body>
            <div class="container">
              <h1>📊 BÁO CÁO CẤU TRÚC & ĐÓNG GÓP CHI TIẾT</h1>
              
              <div class="info-grid">
                <div><p><b>Dự án:</b> VocabSimple</p><p><b>Phạm vi:</b> $SEARCH_PATH (Cấp 15)</p></div>
                <div><p><b>Tổng Commits:</b> $TOTAL_COMMITS</p><p><b>Cập nhật:</b> $(date '+%H:%M - %d/%m/%Y')</p></div>
              </div>

              <h2>1. Tổng hợp đóng góp</h2>
              <table>
                <thead><tr><th>Thành viên</th><th>Commits</th><th>Dòng thêm</th><th>Dòng xóa</th><th>Số Files</th></tr></thead>
                <tbody>$CONTRIBUTORS_ROWS</tbody>
              </table>

              <h2>2. Chi tiết Ownership theo File</h2>
              <table id="ownershipTable">
                <thead><tr><th>Tên File (.dart)</th><th>Người code chính</th><th>Tỷ lệ %</th></tr></thead>
                <tbody>$OWNERSHIP_ROWS</tbody>
              </table>
              <button id="loadMoreBtn" class="btn-show-more">Đang tải dữ liệu...</button>

              <h2>3. Tốc độ commit theo tuần</h2>
              <div style="height: 300px; margin-top: 20px;"><canvas id="timelineChart"></canvas></div>
            </div>

            <script>
              document.addEventListener('DOMContentLoaded', () => {
                const rows = Array.from(document.querySelectorAll('.ownership-row'));
                const btn = document.getElementById('loadMoreBtn');
                const PAGE_SIZE = 15;
                let currentIndex = PAGE_SIZE;

                if (rows.length <= PAGE_SIZE) {
                  btn.style.display = 'none';
                } else {
                  // Ẩn các dòng ban đầu
                  rows.forEach((row, index) => {
                    if (index >= PAGE_SIZE) row.classList.add('hidden');
                  });
                  
                  btn.innerText = 'Xem thêm file (' + (rows.length - PAGE_SIZE) + ' file còn lại)';

                  btn.addEventListener('click', () => {
                    const nextIndex = currentIndex + PAGE_SIZE;
                    rows.slice(currentIndex, nextIndex).forEach(row => row.classList.remove('hidden'));
                    currentIndex = nextIndex;

                    if (currentIndex >= rows.length) {
                      btn.style.display = 'none';
                    } else {
                      btn.innerText = 'Xem thêm file (' + (rows.length - currentIndex) + ' file còn lại)';
                    }
                  });
                }
              });

              // Chart.js
              new Chart(document.getElementById('timelineChart'), {
                type: 'line',
                data: {
                  labels: [$WEEKLY_LABELS],
                  datasets: [{
                    label: 'Số lượng Commits',
                    data: [$WEEKLY_DATA],
                    borderColor: '#1a73e8',
                    backgroundColor: 'rgba(26,115,232,0.1)',
                    tension: 0.3,
                    fill: true
                  }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            </script>
          </body>
          </html>
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-professional-report
          path: git-report.html
