name: Generate Git Report

on:
  push:
    branches: [ main, master ]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate git report
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          CONTRIBUTORS_COUNT=$(git shortlog -sn --all | wc -l)
          FILES_TOTAL=$(git ls-files | wc -l)

          CONTRIBUTORS_ROWS=""
          JS_LABELS=""
          JS_DATA_COMMITS=""
          JS_DATA_PERCENT=""

          AUTHORS=$(git log --format='%ae' | sort -u)

          for EMAIL in $AUTHORS; do
            NAME=$(git log --author="$EMAIL" --format='%an' -1)
            C_COUNT=$(git rev-list --count --author="$EMAIL" HEAD)
            
            # Tính LOC+ và LOC-
            STATS=$(git log --author="$EMAIL" --numstat --pretty=tformat: | awk '{ add += $1; subs += $2 } END { printf "%s %s", add, subs }')
            LOC_ADD=$(echo $STATS | awk '{print $1}'); [ -z "$LOC_ADD" ] && LOC_ADD=0
            LOC_SUB=$(echo $STATS | awk '{print $2}'); [ -z "$LOC_SUB" ] && LOC_SUB=0

            # Đếm số file đã sửa
            F_COUNT=$(git log --author="$EMAIL" --name-only --pretty=format: | sort -u | sed '/^\s*$/d' | wc -l)
            
            # ĐẾM PR: Đếm các commit có từ khóa "Merge pull request" hoặc kết thúc bằng số PR "(#...)"
            PR_COUNT=$(git log --author="$EMAIL" --grep="Merge pull request\|(#[0-9]*) " --count HEAD)
            
            PERCENT=$(awk "BEGIN {printf \"%.2f\", ($C_COUNT/$TOTAL_COMMITS)*100}")

            CONTRIBUTORS_ROWS+="<tr><td>$NAME</td><td>$C_COUNT</td><td style='color:#2ea44f'>+$LOC_ADD</td><td style='color:#cb2431'>-$LOC_SUB</td><td>$F_COUNT</td><td>$PR_COUNT</td><td><strong>$PERCENT%</strong></td></tr>"
            
            JS_LABELS+="\"$NAME\","
            JS_DATA_COMMITS+="$C_COUNT,"
            JS_DATA_PERCENT+="$PERCENT,"
          done

          # Lấy toàn bộ lịch sử commit, đánh dấu các dòng sau dòng thứ 10 là hidden
          COMMIT_HISTORY_ROWS=""
          IDX=0
          while read -r hash date msg; do
            CLASS=""
            [ $IDX -ge 10 ] && CLASS="hidden-row"
            COMMIT_HISTORY_ROWS+="<tr class='$CLASS'><td><code>$hash</code></td><td>$date</td><td>$msg</td></tr>"
            IDX=$((IDX+1))
          done < <(git log --pretty=format:"%h %as %s")

          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Git Report - $REPO_NAME</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #333; }
                  .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
                  .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
                  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 15px; text-align: center; }
                  .card h3 { margin: 0; font-size: 13px; color: #586069; text-transform: uppercase; }
                  .card .val { font-size: 28px; font-weight: bold; color: #0366d6; margin-top: 5px; }
                  .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 40px; }
                  .chart-container { border: 1px solid #e1e4e8; padding: 20px; border-radius: 6px; height: 350px; }
                  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
                  th { background: #f6f8fa; padding: 12px; text-align: left; border-bottom: 2px solid #e1e4e8; }
                  td { padding: 12px; border-bottom: 1px solid #e1e4e8; font-size: 14px; }
                  .hidden-row { display: none; }
                  .btn-show { width: 100%; padding: 12px; background: #f6f8fa; border: 1px solid #e1e4e8; cursor: pointer; font-weight: bold; border-radius: 6px; margin-bottom: 30px; }
                  .btn-show:hover { background: #eef1f4; }
                  code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; color: #d63384; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📊 Git Project Report: $REPO_NAME</h1>
                  
                  <div class="summary-cards">
                      <div class="card"><h3>Total Commits</h3><div class="val">$TOTAL_COMMITS</div></div>
                      <div class="card"><h3>Contributors</h3><div class="val">$CONTRIBUTORS_COUNT</div></div>
                      <div class="card"><h3>Total Files</h3><div class="val">$FILES_TOTAL</div></div>
                      <div class="card"><h3>Report Date</h3><div class="val">$(date +'%d/%m/%Y')</div></div>
                  </div>

                  <div class="charts-grid">
                      <div class="chart-container"><canvas id="barChart"></canvas></div>
                      <div class="chart-container"><canvas id="pieChart"></canvas></div>
                  </div>

                  <h2>1. Contribution Details</h2>
                  <table>
                      <thead><tr><th>Member</th><th>Commits</th><th>LOC+</th><th>LOC-</th><th>Files</th><th>PRs</th><th>Contrib %</th></tr></thead>
                      <tbody>$CONTRIBUTORS_ROWS</tbody>
                  </table>

                  <h2>2. Commit History</h2>
                  <table>
                      <thead><tr><th>Hash</th><th>Date</th><th>Message</th></tr></thead>
                      <tbody id="commitBody">$COMMIT_HISTORY_ROWS</tbody>
                  </table>
                  <button class="btn-show" id="btnShow" onclick="toggleCommits()">Show More Commits</button>
              </div>

              <script>
                  const labels = [$JS_LABELS];
                  new Chart(document.getElementById('barChart'), {
                      type: 'bar',
                      data: { labels: labels, datasets: [{ label: 'Commits', data: [$JS_DATA_COMMITS], backgroundColor: '#3498db' }] },
                      options: { responsive: true, maintainAspectRatio: false }
                  });

                  new Chart(document.getElementById('pieChart'), {
                      type: 'doughnut',
                      data: { labels: labels, datasets: [{ data: [$JS_DATA_PERCENT], backgroundColor: ['#2ea44f', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#e74c3c'] }] },
                      options: { responsive: true, maintainAspectRatio: false }
                  });

                  function toggleCommits() {
                      const hiddenRows = document.querySelectorAll('.hidden-row');
                      const btn = document.getElementById('btnShow');
                      hiddenRows.forEach(row => row.classList.remove('hidden-row'));
                      btn.style.display = 'none';
                  }
              </script>
          </body>
          </html>
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: git-report
          path: git-report.html
