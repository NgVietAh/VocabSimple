name: Generate Git Report

on:
  push:
    branches: [ main, master ]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng: Phải lấy toàn bộ lịch sử để đếm commit/contributors

      - name: Generate git report
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          
          # 1. Thu thập thông tin tổng quan
          COMMITS=$(git rev-list --count HEAD)
          CONTRIBUTORS_COUNT=$(git shortlog -sn --all | wc -l)
          FILES_COUNT=$(git ls-files | wc -l)

          # 2. Xử lý danh sách Contributors (Dùng vòng lặp để tạo hàng cho bảng)
          CONTRIBUTORS_ROWS=""
          # Lấy danh sách: số commit + tên tác giả
          while read -r line; do
            count=$(echo $line | awk '{print $1}')
            name=$(echo $line | cut -d' ' -f2-)
            
            # Tính toán tỷ lệ % đóng góp (tạm tính)
            percent=$(awk "BEGIN {printf \"%.1f\", ($count/$COMMITS)*100}")
            
            CONTRIBUTORS_ROWS+="<tr><td>$name</td><td>$count</td><td>-</td><td>-</td><td>-</td><td>-</td><td>$percent%</td></tr>"
          done < <(git shortlog -sn --all)

          # 3. Xử lý danh sách Commit gần đây (Top 10)
          RECENT_COMMITS=""
          while read -r hash date msg; do
            RECENT_COMMITS+="<tr><td><code>$hash</code></td><td>$date</td><td>$msg</td></tr>"
          done < <(git log --pretty=format:"%h %as %s" -10)

          # 4. Xuất file HTML với CSS từ file mẫu của bạn
          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Git Report - $REPO_NAME</title>
              <style>
                  body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
                  .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
                  h1 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
                  h2 { color: #34495e; margin-top: 40px; border-left: 5px solid #0366d6; padding-left: 10px; }
                  .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
                  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 20px; text-align: center; }
                  .card h3 { margin: 0 0 10px; font-size: 14px; color: #586069; text-transform: uppercase; }
                  .card .val { font-size: 32px; font-weight: bold; color: #0366d6; }
                  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
                  th { background: #f6f8fa; padding: 12px; text-align: left; border-bottom: 2px solid #e1e4e8; }
                  td { padding: 12px; border-bottom: 1px solid #e1e4e8; }
                  code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; color: #d63384; font-family: monospace; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📊 Git Project Report: $REPO_NAME</h1>
                  
                  <div class="summary-cards">
                      <div class="card"><h3>Total Commits</h3><div class="val">$COMMITS</div></div>
                      <div class="card"><h3>Contributors</h3><div class="val">$CONTRIBUTORS_COUNT</div></div>
                      <div class="card"><h3>Files Count</h3><div class="val">$FILES_COUNT</div></div>
                      <div class="card"><h3>Status</h3><div class="val">Active</div></div>
                  </div>

                  <h2>1. Contribution & Performance</h2>
                  <table>
                      <tr>
                          <th>Member</th>
                          <th>Commits</th>
                          <th>LOC+</th>
                          <th>LOC-</th>
                          <th>Files</th>
                          <th>PRs</th>
                          <th>Contrib %</th>
                      </tr>
                      $CONTRIBUTORS_ROWS
                  </table>

                  <h2>2. Recent Commits</h2>
                  <table>
                      <tr><th>Hash</th><th>Date</th><th>Commit Message</th></tr>
                      $RECENT_COMMITS
                  </table>
              </div>
          </body>
          </html>
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: git-report
          path: git-report.html
