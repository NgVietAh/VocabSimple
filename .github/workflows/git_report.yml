name: Generate Git Professional Report

on:
  push:
    branches: [ main, master ]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Report
        run: |
          # 1. THÔNG TIN CƠ BẢN
          REPO_NAME="VocabSimple"
          REPO_URL="https://github.com/NgVietAh/VocabSimple"
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          # 2. THỐNG KÊ CONTRIBUTORS (Mục 3)
          CONTRIBUTORS_ROWS=""
          JS_LABELS=""
          JS_DATA_COMMITS=""
          AUTHORS=$(git log --format='%ae' | sort -u)
          for EMAIL in $AUTHORS; do
            NAME=$(git log --author="$EMAIL" --format='%an' -1)
            C_COUNT=$(git rev-list --count --author="$EMAIL" HEAD)
            STATS=$(git log --author="$EMAIL" --numstat --pretty=tformat: | awk '{ add += $1; subs += $2 } END { printf "%s %s", add, subs }')
            LOC_ADD=$(echo $STATS | awk '{print $1}'); [ -z "$LOC_ADD" ] && LOC_ADD=0
            LOC_SUB=$(echo $STATS | awk '{print $2}'); [ -z "$LOC_SUB" ] && LOC_SUB=0
            F_COUNT=$(git log --author="$EMAIL" --name-only --pretty=format: | sort -u | sed '/^\s*$/d' | wc -l)
            PR_COUNT=$(git log --author="$EMAIL" --grep="Merge pull request\|(#[0-9]*) " --count HEAD)
            
            CONTRIBUTORS_ROWS+="<tr><td><b>$NAME</b></td><td>$C_COUNT</td><td style='color:green'>+$LOC_ADD</td><td style='color:red'>-$LOC_SUB</td><td>$F_COUNT</td><td>$PR_COUNT</td></tr>"
            JS_LABELS+="\"$NAME\","
            JS_DATA_COMMITS+="$C_COUNT,"
          done

          # 3. TIMELINE THEO TUẦN (Mục 4)
          WEEKLY_LABELS=""
          WEEKLY_DATA=""
          for i in {7..0}; do
            DATE_VAL=$(date -d "$i weeks ago" +%Y-%m-%d)
            W_COUNT=$(git rev-list --count --since="$DATE_VAL 00:00:00" HEAD)
            WEEKLY_LABELS+="\"Week $i\","
            WEEKLY_DATA+="$W_COUNT,"
          done

          # 4. CODE OWNERSHIP (Mục 5) - Quét các file .dart quan trọng trong lib/
          OWNERSHIP_ROWS=""
          # Tìm các file Dart lớn nhất/quan trọng nhất
          FILES=$(find lib -name "*.dart" ! -name "*.g.dart" | xargs du | sort -rn | head -n 8 | awk '{print $2}')
          for file in $FILES; do
            if [ -f "$file" ]; then
              OWNER=$(git blame --line-porcelain "$file" | grep "^author " | sort | uniq -c | sort -rn | head -1 | sed 's/^.*author //')
              TOTAL_LINES=$(wc -l < "$file")
              OWNER_LINES=$(git blame --line-porcelain "$file" | grep "^author $OWNER" | wc -l)
              PERCENT=$(awk "BEGIN {printf \"%.1f\", ($OWNER_LINES/$TOTAL_LINES)*100}")
              OWNERSHIP_ROWS+="<tr><td><code>$file</code></td><td>$OWNER</td><td><div style='background:#eee;width:100px;height:10px;display:inline-block;border-radius:5px;overflow:hidden'><div style='background:#1a73e8;width:$PERCENT%;height:100%'></div></div> $PERCENT%</td></tr>"
            fi
          done

          # 5. SUMMARY OF PULL REQUESTS (Mục 6)
          PR_HISTORY=""
          while read -r hash date msg; do
            PR_HISTORY+="<tr><td><code>$hash</code></td><td>$date</td><td>$msg</td></tr>"
          done < <(git log --grep="Merge pull request\|(#[0-9]*) " --pretty=format:"%h %as %s" -10)

          # 6. TẠO FILE HTML
          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>GIT REPORT - Group 10</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 40px; color: #333; }
                  .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
                  h1 { text-align: center; color: #1a73e8; font-size: 28px; border-bottom: 3px solid #1a73e8; padding-bottom: 10px; }
                  h2 { background: #e8f0fe; padding: 10px 15px; color: #1967d2; font-size: 18px; border-radius: 4px; margin-top: 30px; }
                  .info-box { display: flex; justify-content: space-between; gap: 20px; }
                  .info-box div { flex: 1; }
                  table { width: 100%; border-collapse: collapse; margin: 15px 0; }
                  th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
                  th { background: #f1f3f4; font-weight: 600; }
                  .chart-container { height: 350px; margin: 20px 0; }
                  code { font-family: 'Courier New', monospace; color: #d93025; background: #fdf2f2; padding: 2px 4px; border-radius: 3px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>GIT PROJECT REPORT</h1>

                  <h2>1. Project Information</h2>
                  <div class="info-box">
                      <div>
                          <p><b>Project Name:</b> Ứng dụng học từ vựng tiếng Anh</p>
                          <p><b>Group Number:</b> 10</p>
                          <p><b>Main technologies:</b> Flutter, Firebase</p>
                      </div>
                      <div>
                          <p><b>Members:</b></p>
                          <ul style="margin:0; padding-left:20px;">
                              <li>Nguyễn Việt Anh – 123210027 – Leader</li>
                              <li>Trịnh Minh Ánh – 123210028 – Member</li>
                              <li>Nguyễn Hữu Hưng – 123210136 – Member</li>
                          </ul>
                      </div>
                  </div>

                  <h2>2. Repository Information</h2>
                  <p><b>Repository URL:</b> <a href="$REPO_URL">$REPO_URL</a></p>
                  <p><b>Branching strategy:</b> Feature Branch / Git Flow</p>
                  <p><b>Total commits:</b> $TOTAL_COMMITS</p>

                  <h2>3. Individual Contribution Summary</h2>
                  <table>
                      <thead><tr><th>Member</th><th>Commits</th><th>LOC+</th><th>LOC-</th><th>Files</th><th>PRs</th></tr></thead>
                      <tbody>$CONTRIBUTORS_ROWS</tbody>
                  </table>

                  <h2>4. Contribution Timeline (Weekly Activity)</h2>
                  <div class="chart-container"><canvas id="timelineChart"></canvas></div>

                  <h2>5. Code Ownership Map (Key Modules)</h2>
                  <table>
                      <thead><tr><th>File/Module Path</th><th>Primary Owner</th><th>Ownership (%)</th></tr></thead>
                      <tbody>$OWNERSHIP_ROWS</tbody>
                  </table>

                  <h2>6. Summary of Pull Requests</h2>
                  <table>
                      <thead><tr><th>Hash</th><th>Date</th><th>PR Title / Merge Message</th></tr></thead>
                      <tbody>$PR_HISTORY</tbody>
                  </table>

                  <h2>7. Tools Used</h2>
                  <p>GitHub Actions (Automated Reporting), Gitinspector-logic, Chart.js.</p>
              </div>

              <script>
                  new Chart(document.getElementById('timelineChart'), {
                      type: 'line',
                      data: {
                          labels: [$WEEKLY_LABELS],
                          datasets: [{
                              label: 'Cumulative Project Activity',
                              data: [$WEEKLY_DATA],
                              borderColor: '#1a73e8',
                              backgroundColor: 'rgba(26, 115, 232, 0.1)',
                              fill: true,
                              tension: 0.3
                          }]
                      },
                      options: { responsive: true, maintainAspectRatio: false }
                  });
              </script>
          </body>
          </html>
          EOF

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: Group10-Git-Report
          path: git-report.html
