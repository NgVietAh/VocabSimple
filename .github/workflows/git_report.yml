name: Generate Git Professional Report

on:
  push:
    branches: [main, master]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Report
        run: |
          # --- Cấu hình biến ---
          PROJECT_DIR="vocabsimple"
          SEARCH_PATH="$PROJECT_DIR/lib"

          # 1. THỐNG KÊ CHUNG
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          # 2. THỐNG KÊ CONTRIBUTORS (Mục 3)
          CONTRIBUTORS_ROWS=""
          AUTHORS=$(git log --format='%ae' | sort -u)
          for EMAIL in $AUTHORS; do
            NAME=$(git log --author="$EMAIL" --format='%an' -1)
            C_COUNT=$(git rev-list --count --author="$EMAIL" HEAD)
            STATS=$(git log --author="$EMAIL" --numstat --pretty=tformat: | awk 'NF{ add += $1; subs += $2 } END { printf "%d %d", add, subs }')
            LOC_ADD=$(echo $STATS | awk '{print $1}'); [ -z "$LOC_ADD" ] && LOC_ADD=0
            LOC_SUB=$(echo $STATS | awk '{print $2}'); [ -z "$LOC_SUB" ] && LOC_SUB=0
            F_COUNT=$(git log --author="$EMAIL" --name-only --pretty=format: | sort -u | sed '/^\s*$/d' | wc -l)
            CONTRIBUTORS_ROWS+="<tr><td><b>$NAME</b></td><td>$C_COUNT</td><td><span style='color:green'>+$LOC_ADD</span></td><td><span style='color:red'>-$LOC_SUB</span></td><td>$F_COUNT</td></tr>"
          done

          # 3. TIMELINE THEO TUẦN (Mục 4)
          WEEKLY_LABELS=""
          WEEKLY_DATA=""
          for i in {7..0..-1}; do
            DATE_VAL=$(date -d "$i weeks ago" +%Y-%m-%d)
            W_COUNT=$(git rev-list --count --since="$DATE_VAL 00:00:00" HEAD)
            WEEKLY_LABELS+="\"W-$i\", "
            WEEKLY_DATA+="$W_COUNT, "
          done
          WEEKLY_LABELS=$(echo $WEEKLY_LABELS | sed 's/, $//')
          WEEKLY_DATA=$(echo $WEEKLY_DATA | sed 's/, $//')

          # 4. CODE OWNERSHIP (Mục 5 - Max depth 15)
          OWNERSHIP_ROWS=""
          if [ -d "$SEARCH_PATH" ]; then
            ALL_FILES=$(find "$SEARCH_PATH" -maxdepth 15 -name "*.dart" -type f)
            while read -r file; do
              FILE_LINES=$(wc -l < "$file")
              if [ "$FILE_LINES" -gt 0 ]; then
                OWNER=$(git blame --line-porcelain "$file" | grep "^author " | sort | uniq -c | sort -rn | head -1 | sed 's/^.*author //')
                OWNER_LINES=$(git blame --line-porcelain "$file" | grep "^author $OWNER" | wc -l)
                PERCENT=$(awk "BEGIN {printf \"%.1f\", ($OWNER_LINES/$FILE_LINES)*100}")
                DISPLAY_NAME=$(echo "$file" | sed "s|$PROJECT_DIR/||")
                OWNERSHIP_ROWS+="<tr class='own-row'><td><code>$DISPLAY_NAME</code></td><td>$OWNER</td><td><div style='background:#eee; width:60px; height:8px; display:inline-block; border-radius:4px;'><div style='background:#34a853; width:$PERCENT%; height:100%; border-radius:4px;'></div></div> $PERCENT%</td></tr>"
              fi
            done <<< "$ALL_FILES"
          fi

          # 5. PULL REQUESTS (Mục 6)
          PR_ROWS=""
          git log --grep="Merge" --pretty=format:"%h|%as|%an|%s" -n 30 > pr_logs.txt
          while IFS="|" read -r hash date author msg; do
            safe_msg=$(echo "$msg" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
            PR_ROWS+="<tr class='pr-row'><td><code>$hash</code></td><td>$date</td><td>$author</td><td>$safe_msg</td></tr>"
          done < pr_logs.txt

          # 6. TẠO FILE HTML HOÀN CHỈNH
          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Git Final Report - Group 10</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 20px; color: #1c1e21; }
                  .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
                  h1 { text-align: center; color: #1a73e8; font-size: 2.2em; margin-bottom: 30px; border-bottom: 2px solid #e4e6eb; padding-bottom: 15px; }
                  h2 { background: #e7f3ff; color: #1877f2; padding: 12px 20px; border-radius: 8px; font-size: 1.2em; margin-top: 40px; display: flex; align-items: center; }
                  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 20px; background: #f7f8fa; padding: 20px; border-radius: 8px; }
                  table { width: 100%; border-collapse: collapse; margin: 15px 0; background: white; }
                  th, td { border: 1px solid #ebedf0; padding: 14px; text-align: left; font-size: 13px; }
                  th { background: #f5f6f7; color: #606770; font-weight: 600; text-transform: uppercase; font-size: 11px; }
                  .pr-hidden, .own-hidden { display: none; }
                  .btn-view { width: 100%; padding: 12px; background: #fff; border: 1px solid #1a73e8; color: #1a73e8; cursor: pointer; border-radius: 6px; font-weight: 600; margin-top: 10px; transition: 0.2s; }
                  .btn-view:hover { background: #e7f3ff; }
                  code { font-family: 'SFMono-Regular', Consolas, monospace; color: #e83e8c; background: #f8f9fa; padding: 3px 6px; border-radius: 4px; font-size: 12px; }
                  .chart-box { height: 300px; margin: 20px 0; }
                  .tool-badge { background: #333; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-right: 5px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📊 GIT PROJECT REPORT - GROUP 10</h1>

                  <h2>1. Project Information</h2>
                  <div class="info-grid">
                      <div>
                          <p><b>Project Name:</b> Ứng dụng học từ vựng tiếng Anh (VocabSimple)</p>
                          <p><b>Group Number:</b> 10</p>
                          <p><b>Technologies:</b> Flutter, Firebase</p>
                      </div>
                      <div>
                          <p><b>Members:</b></p>
                          <ul style="margin:0; padding-left:18px; font-size: 14px;">
                              <li>Nguyễn Việt Anh (123210027) - Leader</li>
                              <li>Trịnh Minh Ánh (123210028) - Member</li>
                              <li>Nguyễn Hữu Hưng (123210136) - Member</li>
                          </ul>
                      </div>
                  </div>

                  <h2>2. Repository Information</h2>
                  <p><b>URL:</b> <a href="https://github.com/NgVietAh/VocabSimple" target="_blank">VocabSimple GitHub Repo</a></p>
                  <p><b>Total Project Commits:</b> $TOTAL_COMMITS</p>
                  <p><b>Branching Strategy:</b> Feature Branch / Main-only</p>

                  <h2>3. Individual Contribution Summary</h2>
                  <table>
                      <thead><tr><th>Member</th><th>Commits</th><th>Added</th><th>Removed</th><th>Files</th></tr></thead>
                      <tbody>$CONTRIBUTORS_ROWS</tbody>
                  </table>

                  <h2>4. Contribution Timeline</h2>
                  <div class="chart-box"><canvas id="timelineChart"></canvas></div>

                  <h2>5. Code Ownership Map (Depth 15)</h2>
                  <table id="ownTable">
                      <thead><tr><th>File Path</th><th>Owner</th><th>Contribution</th></tr></thead>
                      <tbody>$OWNERSHIP_ROWS</tbody>
                  </table>
                  <button id="btnOwn" class="btn-view" onclick="toggleRows('own')">Xem thêm file...</button>

                  <h2>6. Summary of Pull Requests</h2>
                  <table id="prTable">
                      <thead><tr><th>Hash</th><th>Date</th><th>Author</th><th>Message</th></tr></thead>
                      <tbody>$PR_ROWS</tbody>
                  </table>
                  <button id="btnPr" class="btn-view" onclick="toggleRows('pr')">Xem thêm PR...</button>

                  <h2>7. Tools Used for Reporting</h2>
                  <div style="margin-top:15px;">
                      <span class="tool-badge">GitHub Actions</span>
                      <span class="tool-badge">Git Blame Engine</span>
                      <span class="tool-badge">Chart.js</span>
                      <span class="tool-badge">Shell Automation</span>
                  </div>
              </div>

              <script>
                  // Logic Toggle cho Ownership và PR
                  function setupToggle(className, btnId, limit) {
                      const rows = document.querySelectorAll('.' + className);
                      if (rows.length <= limit) {
                          document.getElementById(btnId).style.display = 'none';
                          return;
                      }
                      rows.forEach((row, i) => {
                          if (i >= limit) row.classList.add(className + '-hidden');
                      });
                  }

                  let expanded = { pr: false, own: false };
                  function toggleRows(type) {
                      expanded[type] = !expanded[type];
                      const rows = document.querySelectorAll('.' + type + '-row');
                      const btn = document.getElementById('btn' + type.charAt(0).toUpperCase() + type.slice(1));
                      
                      rows.forEach((row, i) => {
                          if (i >= 10) row.classList.toggle(type + '-hidden', !expanded[type]);
                      });
                      btn.innerText = expanded[type] ? 'Thu gọn' : 'Xem thêm...';
                  }

                  setupToggle('own-row', 'btnOwn', 10);
                  setupToggle('pr-row', 'btnPr', 10);

                  // Biểu đồ Timeline
                  new Chart(document.getElementById('timelineChart'), {
                      type: 'line',
                      data: {
                          labels: [$WEEKLY_LABELS],
                          datasets: [{
                              label: 'Commits',
                              data: [$WEEKLY_DATA],
                              borderColor: '#1877f2',
                              backgroundColor: 'rgba(24, 119, 242, 0.1)',
                              fill: true,
                              tension: 0.4
                          }]
                      },
                      options: { responsive: true, maintainAspectRatio: false }
                  });
              </script>
          </body>
          </html>
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Git-Final-Report-Group10
          path: git-report.html
