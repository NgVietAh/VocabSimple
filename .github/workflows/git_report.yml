name: Generate Git Professional Report

on:
  push:
    branches: [main, master]

jobs:
  git-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Git Report
        run: |
          # 1. THÔNG TIN CƠ BẢN
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          # 2. THỐNG KÊ CONTRIBUTORS
          CONTRIBUTORS_ROWS=""
          AUTHORS=$(git log --format='%ae' | sort -u)
          for EMAIL in $AUTHORS; do
            NAME=$(git log --author="$EMAIL" --format='%an' -1)
            C_COUNT=$(git rev-list --count --author="$EMAIL" HEAD)
            STATS=$(git log --author="$EMAIL" --numstat --pretty=tformat: | awk '{ add += $1; subs += $2 } END { printf "%s %s", add, subs }')
            LOC_ADD=$(echo $STATS | awk '{print $1}'); [ -z "$LOC_ADD" ] && LOC_ADD=0
            LOC_SUB=$(echo $STATS | awk '{print $2}'); [ -z "$LOC_SUB" ] && LOC_SUB=0
            F_COUNT=$(git log --author="$EMAIL" --name-only --pretty=format: | sort -u | sed '/^\s*$/d' | wc -l)
            PR_COUNT=$(git log --author="$EMAIL" --grep="(#[0-9]\+)" --pretty=oneline | wc -l)

            CONTRIBUTORS_ROWS+="<tr><td><b>$NAME</b></td><td>$C_COUNT</td><td><span style='color:green'>+$LOC_ADD</span></td><td><span style='color:red'>-$LOC_SUB</span></td><td>$F_COUNT</td><td><b style='color:#1a73e8'>$PR_COUNT</b></td></tr>"
          done

          # 3. TIMELINE THEO TUẦN
          WEEKLY_LABELS=""
          WEEKLY_DATA=""
          for i in {7..0}; do
            DATE_VAL=$(date -d "$i weeks ago" +%Y-%m-%d)
            W_COUNT=$(git rev-list --count --since="$DATE_VAL 00:00:00" HEAD)
            WEEKLY_LABELS+="\"Week $i\","
            WEEKLY_DATA+="$W_COUNT,"
          done

          # 4. CODE OWNERSHIP MAP (lib + assets)
          OWNERSHIP_ROWS=""

          # Kiểm tra thư mục lib
          if [ -d "lib" ]; then
            DIRS=$(find lib -maxdepth 2 -type d)
            for dir in $DIRS; do
              TOTAL_LINES_DIR=$(find "$dir" -name "*.dart" -exec wc -l {} + | awk '{sum+=$1} END {print sum}')
              if [ -n "$TOTAL_LINES_DIR" ] && [ "$TOTAL_LINES_DIR" -gt 0 ]; then
                OWNER=$(git blame --line-porcelain $(find "$dir" -name "*.dart") | grep "^author " | sort | uniq -c | sort -rn | head -1 | sed 's/^.*author //')
                OWNER_LINES=$(git blame --line-porcelain $(find "$dir" -name "*.dart") | grep "^author $OWNER" | wc -l)
                PERCENT=$(awk "BEGIN {printf \"%.1f\", ($OWNER_LINES/$TOTAL_LINES_DIR)*100}")
                OWNERSHIP_ROWS+="<tr><td><span class='folder-badge'>/$dir/</span></td><td>$OWNER</td><td><div class='progress-container'><div class='progress-bar' style='width: $PERCENT%'></div></div><span class='percent-text'>$PERCENT%</span></td></tr>"
              fi
            done
          else
            OWNERSHIP_ROWS+="<tr><td colspan='3'>⚠️ Không tìm thấy thư mục lib</td></tr>"
          fi

          # Kiểm tra thư mục assets
          if [ -d "assets" ]; then
            DIRS=$(find assets -maxdepth 2 -type d)
            for dir in $DIRS; do
              TOTAL_FILES_DIR=$(find "$dir" -type f | wc -l)
              if [ "$TOTAL_FILES_DIR" -gt 0 ]; then
                OWNER=$(git log --pretty=format:"%an" -- "$dir" | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
                OWNERSHIP_ROWS+="<tr><td><span class='folder-badge'>/$dir/</span></td><td>$OWNER</td><td><span class='percent-text'>$TOTAL_FILES_DIR files</span></td></tr>"
              fi
            done
          else
            OWNERSHIP_ROWS+="<tr><td colspan='3'>⚠️ Không tìm thấy thư mục assets</td></tr>"
          fi

          # 5. LỊCH SỬ PULL REQUESTS
          PR_HISTORY_ROWS=""
          while read -r hash date msg; do
            PR_HISTORY_ROWS+="<tr><td><code>$hash</code></td><td><small>$date</small></td><td>$msg</td></tr>"
          done < <(git log --grep="(#[0-9]\+)" --pretty=format:"%h %as %s" -n 10)

          # 6. TẠO HTML
          cat <<EOF > git-report.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; color: #333; padding: 20px; }
              .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
              h1 { color: #1a73e8; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
              h2 { margin-top: 30px; font-size: 1.4em; color: #444; }
              table { width: 100%; border-collapse: collapse; margin-top: 10px; }
              th { background: #f8f9fa; text-align: left; padding: 12px; border-bottom: 2px solid #dee2e6; color: #666; font-size: 0.9em; }
              td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.95em; }
              .folder-badge { background: #f0f2f5; padding: 6px 12px; border-radius: 6px; font-family: monospace; color: #555; }
              .progress-container { background: #eee; width: 150px; height: 10px; display: inline-block; border-radius: 5px; vertical-align: middle; margin-right: 10px; overflow: hidden; }
              .progress-bar { background: #1a73e8; height: 100%; border-radius: 5px; }
              .percent-text { font-weight: bold; color: #1a73e8; min-width: 45px; display: inline-block; }
              .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #e7f3ff; padding: 20px; border-radius: 10px; }
              .chart-box { height: 250px; margin-top: 20px; }
            </style>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          </head>
          <body>
            <div class="container">
              <h1>📊 BÁO CÁO DỰ ÁN GIT - NHÓM 10</h1>
              <div class="info-grid">
                <div>
                  <p><b>Dự án:</b> VocabSimple</p>
                  <p><b>Công nghệ:</b> Flutter & Firebase</p>
                </div>
                <div>
                  <p><b>Tổng số Commits:</b> $TOTAL_COMMITS</p>
                  <p><b>Trạng thái:</b> Đã hoàn thành Merge</p>
                </div>
              </div>
              <h2>1. Đóng góp cá nhân (PR tập trung)</h2>
              <table><thead><tr><th>Thành viên</th><th>Commits</th><th>Dòng thêm</th><th>Dòng xóa</th><th>File đã sửa</th><
